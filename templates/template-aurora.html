<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>欢迎访问</title>
  <meta name="description" content="一个简洁、稳定、可用于长期访问的品牌展示入口。" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="欢迎访问" />
  <meta property="og:description" content="一个简洁、稳定、可用于长期访问的品牌展示入口。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2367e8f9'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/site.css" />
  <style>
    :root {
      --bg-1: #071827;
      --bg-2: #101827;
      --bg-3: #0f172a;
      --primary: #67e8f9;
      --secondary: #8b5cf6;
      --accent: #34d399;
    }
    body {
      background:
        radial-gradient(circle at top left, rgba(103, 232, 249, 0.18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(139, 92, 246, 0.18), transparent 35%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
      background-size: 200% 200%;
      animation: bgDrift 16s ease infinite;
    }
    @keyframes bgDrift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .orb { position: absolute; border-radius: 50%; filter: blur(30px); opacity: 0.8; pointer-events: none; }
    .orb.one { width: 260px; height: 260px; background: rgba(103, 232, 249, 0.2); right: 12%; top: 14%; animation: floatA 8s ease-in-out infinite; }
    .orb.two { width: 300px; height: 300px; background: rgba(139, 92, 246, 0.18); left: 10%; bottom: 12%; animation: floatB 10s ease-in-out infinite; }
    @keyframes floatA { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(12px, -18px); } }
    @keyframes floatB { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-14px, 16px); } }

    .title {
      background: linear-gradient(90deg, var(--primary), var(--secondary), #fbbf24, var(--primary));
      background-size: 300%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: shine 6s linear infinite;
    }

    .feature-box {
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
    }

    @media (max-width: 640px) {
      .orb.one, .orb.two { display: none; }
    }
  </style>
</head>
<body data-page="template">
  <header class="topbar">
    <div class="shell topbar-inner">
      <div class="brand">
        <span class="brand-mark" data-brand-mark aria-hidden="true"></span>
        <span data-brand-text hidden></span>
      </div>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="hero-inner shell">
        <div class="orb one" aria-hidden="true"></div>
        <div class="orb two" aria-hidden="true"></div>
        <h1 class="title" data-brand-title>欢迎访问</h1>
        <p class="sub" data-tagline hidden></p>
        <div class="dots-wrap" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </section>

    <section class="panel" data-link-panel hidden>
      <div class="feature-box">
        <h2><a class="feature-link" data-link rel="noopener">-</a></h2>
      </div>
    </section>
  </main>

  <div class="bottom-bar">
    <div class="bottom-inner shell">
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">工信部备案查询</a>
      <span aria-hidden="true">|</span>
      <span data-icp>粤ICP备00000000号</span>
    </div>
  </div>

  <script src="assets/site.js" defer></script>
</body>
</html>
